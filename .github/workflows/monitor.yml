name: Hurtigruten 舱位监控

# 2026-11-25 已抢到票，定时监控已停用。要恢复，把下面两行取消注释即可。
on:
  # schedule:
  #   - cron: "*/10 * * * *"   # 每 10 分钟（GitHub 高峰期可能会晚几分钟）
  workflow_dispatch:
    inputs:
      mode:
        description: "check = 正常查询；test-mail = 只发一封测试邮件"
        default: check

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Install browser (only used if the plain request is blocked)
        run: pip install playwright==1.48.0 && python -m playwright install --with-deps chromium
        if: ${{ vars.USE_BROWSER == 'true' }}
      - name: Check availability
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python monitor.py ${{ github.event.inputs.mode || 'check' }}
      - name: Save state
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "update state" && git push)
